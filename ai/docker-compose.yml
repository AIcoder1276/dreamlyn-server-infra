services:
    # AI inferences.
    ## Multimodal AI services.
    ai-multimodal-qwen3.5_9b:
        image: vllm/vllm-openai:latest
        container_name: inference-multimodal-qwen3.5_9b
        restart: unless-stopped
        ipc: host
        gpus: all
        ulimits:
            memlock: -1
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
        command: >
            cyankiwi/Qwen3.5-9B-AWQ-4bit
            --served-model-name Qwen/Qwen3.5-9B
            --max-model-len 8192
            --gpu-memory-utilization 0.65
            --cpu-offload-gb 6
            --kv-cache-dtype fp8
            --enable-chunked-prefill
            --limit-mm-per-prompt '{"image": 1}'
            --mm-processor-kwargs '{"max_pixels": 314572}'
            --reasoning-parser qwen3
            --tool-call-parser qwen3_coder
            --enable-auto-tool-choice
            --generation-config vllm
        networks:
            - dreamlyn_infra_internal_network
    ## Music AI services.
    ai-music-musicgen_small:
        build:
            context: ~/Source/repos/inference-music
        container_name: inference-music-musicgen_small
        restart: unless-stopped
        ipc: host
        gpus: all
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - HF_HOME=/app/.cache/huggingface
        command: >
            facebook/musicgen-small
            --served-model-name Facebook/MusicGen-Small
            --host 0.0.0.0
            --port 8000
            --guidance-scale 3.0
            --max-duration-seconds 30
            --max-new-tokens-at-max-duration 1503
        networks:
            - dreamlyn_infra_internal_network
    ## Voice AI services (for speech synthesis).
    ai-voice-omnivoice:
        build:
            context: ~/Source/repos/inference-voice
        container_name: inference-voice-omnivoice
        restart: unless-stopped
        ipc: host
        gpus: all
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - HF_HOME=/app/.cache/huggingface
        command: >
            k2-fsa/OmniVoice
            --served-model-name K2-FSA/OmniVoice
            --host 0.0.0.0
            --port 8000
        networks:
            - dreamlyn_infra_internal_network
    ## Misc services.
    ai-embedding-qwen3_emb_0.6b:
        image: vllm/vllm-openai:latest
        container_name: inference-embedding-qwen3_emb_0.6b
        restart: unless-stopped
        ipc: host
        gpus: all
        command: >
            Qwen/Qwen3-Embedding-0.6B
            --served-model-name Qwen/Qwen3-Embedding-0.6B
            --max-model-len 8192
            --gpu-memory-utilization 0.15
            --cpu-offload-gb 0.5
        networks:
            - dreamlyn_infra_internal_network

    ## SearXNG is a search service for Internet data retrieval.
    searxng:
        image: searxng/searxng:latest
        container_name: tool-search_engine
        restart: unless-stopped
        volumes:
            - ./tools/searxng/settings.yml:/etc/searxng/settings.yml
        networks:
            - dreamlyn_infra_internal_network
        ports:
            - "8080:8080"


networks:
    dreamlyn_infra_internal_network:
        external: true
        name: dreamlyn_mesh
