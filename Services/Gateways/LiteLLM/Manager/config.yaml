general_settings:
    disable_ui: false
    database_url: "os.environ/DB_URL"
    master_key: "os.environ/LITELLM_MASTER_KEY"

model_list:
    - model_name: tzeentch
      litellm_params:
          model: openai/Qwen3.5-9B
          api_base: http://ai-multimodal-qwen3.5_9b:8000/v1
          api_key: "not-needed-locally"
    - model_name: timur
      litellm_params:
          model: openai/MusicGen-Small
          api_base: http://api-gateway-musical_wrapper:8000/v1
          api_key: "not-needed-locally"
    - model_name: elina
      litellm_params:
          model: openai/OmniVoice
          api_base: http://api-gateway-voice_wrapper:8000/v1
          api_key: "not-needed-locally"

search_tools:
    - search_tool_name: searxng-search
      litellm_params:
          search_provider: searxng
          api_base: http://searxng:8080
