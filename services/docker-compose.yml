services:
    # Main server gate. It is used for routing upcoming requests.
    server:
        image: nginx:latest
        container_name: system-server
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        entrypoint: ["/bin/sh", "/etc/nginx/entrypoint/select-mode.sh"]
        environment:
            - DOMAIN=${CERT_DOMAIN}
        volumes:
            - ./system/servers/nginx/logs:/var/log/nginx
            - ./system/servers/nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./system/servers/nginx/config/templates:/etc/nginx/templates:ro
            - ./system/servers/nginx/config/snippets:/etc/nginx/snippets:ro
            - ./system/servers/nginx/entrypoint/select-mode.sh:/etc/nginx/entrypoint/select-mode.sh:ro
            - server_certbot_data:/etc/letsencrypt
        networks:
            - dreamlyn_infra_internal_network

    # Auth service.
    authelia:
        image: authelia/authelia:latest
        container_name: system-auth_manager
        restart: unless-stopped
        volumes:
            - ./system/auth/authelia:/config
        networks:
            - dreamlyn_infra_internal_network
        environment:
            - TZ=UTC

    # Gateways.
    ## LiteLLM (API for AIs).
    ### Manager DB.
    litellm-postgres:
        image: postgres:18-alpine
        container_name: api-ai-litellm-storage
        restart: unless-stopped
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
            - POSTGRES_DB=${DB_NAME}
        volumes:
            - ./api/ai/litellm/postgres:/var/lib/postgresql
        networks:
            - dreamlyn_infra_internal_network
    ### Control panel.
    litellm-master:
        image: ghcr.io/berriai/litellm:main-latest
        container_name: api-ai-litellm-master
        restart: unless-stopped
        depends_on:
            - litellm-postgres
            - milvus-master
        volumes:
            - ./api/ai/litellm/master/config.yaml:/app/config.yaml
        env_file: .env
        environment:
            MILVUS_API_KEY: "${MILVUS_USER_LOGIN}:${MILVUS_USER_PASSWORD}"
            LITELLM_DISABLE_NO_REDIS_WARNING: true
        command: ["--config", "/app/config.yaml"]
        networks:
            - dreamlyn_infra_internal_network
    ## Music request adapter.
    adapter-music:
        build:
            context: ~/Source/repos/api-music_adapter
        container_name: api-ai-adapters-music
        restart: unless-stopped
        depends_on:
            - swfs-s3
        env_file: .env
        volumes:
            - ./api/ai/adapters/music/logs:/app/logs
            - ./api/ai/adapters/music/config.yml:/app/config.yml:ro
        environment:
            - S3_STORAGE_PUBLIC_BASE_URL=https://s3.dreamlyn.ru
        networks:
            - dreamlyn_infra_internal_network
    ## Voice request adapter.
    adapter-voice:
        build:
            context: ~/Source/repos/api-voice_adapter
        container_name: api-ai-adapters-voice
        restart: unless-stopped
        depends_on:
            - swfs-s3
        env_file: .env
        volumes:
            - ./api/ai/adapters/voice/logs:/app/logs
            - ./api/ai/adapters/voice/cache:/app/cache
            - ./api/ai/adapters/voice/config.yml:/app/config.yml:ro
        networks:
            - dreamlyn_infra_internal_network

    # Storage systems.
    ## File storage system (with S3).
    ### Master service.
    swfs-master:
        image: chrislusf/seaweedfs:latest
        container_name: storage-seaweed-master
        restart: unless-stopped
        volumes:
            - ./storages/seaweed/master:/data
        command: >
            master
            -ip=swfs-master
            -ip.bind=0.0.0.0
            -port=9333
            -mdir=/data
        networks:
            - dreamlyn_infra_internal_network
    ### Volume service.
    swfs-volume:
        image: chrislusf/seaweedfs:latest
        container_name: storage-seaweed-volume
        restart: unless-stopped
        depends_on:
            - swfs-master
        volumes:
            - ./storages/seaweed/volume:/data
        command: >
            volume 
            -mserver=swfs-master:9333 
            -ip=swfs-volume 
            -ip.bind=0.0.0.0
            -port=8080 
            -dir=/data
        networks:
            - dreamlyn_infra_internal_network
    ### FS wrapper service.
    swfs-filer:
        image: chrislusf/seaweedfs:latest
        container_name: storage-seaweed-storage_filer
        restart: unless-stopped
        depends_on:
            - swfs-master
            - swfs-volume
        volumes:
            - ./storages/seaweed/filer:/data
        command: >
            filer 
            -master=swfs-master:9333
            -ip=swfs-filer
            -ip.bind=0.0.0.0
            -defaultStoreDir=/data
        expose:
            - 8888
        networks:
            - dreamlyn_infra_internal_network
    ### S3 subsystem.
    swfs-s3:
        image: chrislusf/seaweedfs:latest
        container_name: storage-seaweed-s3_provider
        restart: unless-stopped
        depends_on:
            - swfs-filer
        environment:
            - SEAWEEDFS_S3_ALLOWED_DOMAINS=${CERT_DOMAIN}
        volumes:
            - ./storages/seaweed/s3.json:/etc/seaweedfs/s3.json:ro
        command: >
            s3 
            -filer=swfs-filer:8888
            -config=/etc/seaweedfs/s3.json
        networks:
            - dreamlyn_infra_internal_network
    ## Milvus vector storage.
    ### Metadata collector service.
    milvus-etcd:
        image: quay.io/coreos/etcd:v3.5.25
        container_name: storage-milvus-etcd
        restart: unless-stopped
        environment:
            - ETCD_AUTO_COMPACTION_MODE=revision
            - ETCD_AUTO_COMPACTION_RETENTION=1000
            - ETCD_QUOTA_BACKEND_BYTES=4294967296
            - ETCD_SNAPSHOT_COUNT=8
        volumes:
            - ./storages/milvus/etcd:/etcd
        command: >
            etcd 
            -advertise-client-urls=http://milvus-etcd:2379 
            -listen-client-urls http://0.0.0.0:2379 
            --data-dir /etcd
        healthcheck:
            test: ["CMD", "etcdctl", "endpoint", "health"]
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - dreamlyn_infra_internal_network
    milvus-minio:
        image: minio/minio:RELEASE.2024-05-28T17-19-04Z
        container_name: storage-milvus-minio
        restart: unless-stopped
        environment:
            MINIO_ACCESS_KEY: minioadmin
            MINIO_SECRET_KEY: minioadmin
        volumes:
            - ./storages/milvus/minio:/minio_data
        command: >
            minio server 
            /minio_data 
            --console-address ":9001"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 30s
            timeout: 20s
            retries: 3
        networks:
            - dreamlyn_infra_internal_network
    milvus-master:
        image: milvusdb/milvus:v3.0.0
        container_name: storage-milvus-master
        restart: unless-stopped
        command: ["milvus", "run", "standalone"]
        security_opt:
          - seccomp:unconfined
        environment:
            ETCD_ENDPOINTS: milvus-etcd:2379
            MINIO_ADDRESS: milvus-minio:9000
            MINIO_REGION: us-east-1
            MQ_TYPE: woodpecker
            COMMON_SECURITY_AUTHORIZATIONENABLED: true
            COMMON_SECURITY_DEFAULTROOTPASSWORD: ${MILVUS_ROOT_PASSWORD}
        volumes:
            - ./storages/milvus/master:/var/lib/milvus
            - ./storages/milvus/config/user.yaml:/milvus/configs/user.yaml:ro
        depends_on:
            milvus-etcd:
                condition: service_healthy
            milvus-minio:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
            interval: 30s
            start_period: 90s
            timeout: 20s
            retries: 3
        expose:
          - 19530
        networks:
            - dreamlyn_infra_internal_network
    milvus-webui:
        image: zilliz/attu:latest
        container_name: storage-milvus-web_ui
        environment:
            - MILVUS_ADDRESS=milvus-master:19530
            - MILVUS_TOKEN=root:${MILVUS_ROOT_PASSWORD}
        depends_on:
            milvus-master:
                condition: service_healthy
        networks:
            - dreamlyn_infra_internal_network

    rag-ingestion_service:
        build:
            context: ~/Source/repos/rag-ingestion_service
            dockerfile: Dockerfile
        container_name: pipeline-rag-ingestion_service
        restart: unless-stopped
        volumes:
            - ./pipelines/rag/ingestion_service/config.yml:/app/config.yml:ro
        env_file:
            - ./pipelines/rag/ingestion_service/.env
        expose:
            - "8000"
        networks:
            - dreamlyn_infra_internal_network
        init: true
        stop_grace_period: 2m
    

volumes:
    server_certbot_data:
        external: true


networks:
  dreamlyn_infra_internal_network:
    external: true
    name: dreamlyn_mesh
