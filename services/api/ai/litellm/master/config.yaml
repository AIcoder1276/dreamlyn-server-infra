general_settings:
    disable_ui: false
    database_url: "os.environ/DB_URL"
    master_key: "os.environ/LITELLM_MASTER_KEY"

model_list:
    # Multimodal models.
    - model_name: tzeentch
      litellm_params:
          model: openai/Qwen/Qwen3.5-4B-NVFP4
          api_base: http://ai-multimodal-main:8000/v1
          api_key: "not-needed-locally"
    - model_name: tzeentch-instant
      litellm_params:
          model: openai/Qwen/Qwen3.5-4B-NVFP4
          api_base: http://ai-multimodal-main:8000/v1
          api_key: "not-needed-locally"
          temperature: 0.7
          top_p: 0.8
          extra_body:
              chat_template_kwargs:
                  enable_thinking: false
    # Music models.
    - model_name: timur
      litellm_params:
          model: openai/Facebook/MusicGen-Small
          api_base: http://adapter-music:8000/v1
          api_key: "not-needed-locally"
    # Voice models.
    - model_name: elina
      litellm_params:
          model: openai/K2-FSA/OmniVoice
          api_base: http://adapter-voice:8000/v1
          api_key: "not-needed-locally"
    # Embedding models.
    - model_name: trazyn
      litellm_params:
        model: openai/Qwen/Qwen3-Embedding-0.6B
        api_base: http://ai-embedding-qwen3_emb_0.6b:8000/v1
        api_key: "not-needed-locally"

vector_store_registry:
    - vector_store_name: dreamlyn-lore
      litellm_params:
          vector_store_id: lore_chunks
          custom_llm_provider: milvus
          api_base: https://api-milvus.dreamlyn.ru
          api_key: "os.environ/MILVUS_API_KEY"
          dbName: dreamlyn_lore
          litellm_embedding_model: openai/Qwen/Qwen3-Embedding-0.6B
          litellm_embedding_config:
              api_base: http://ai-embedding-qwen3_emb_0.6b:8000/v1
              api_key: "not-needed-locally"
          milvus_text_field: text
          annsField: vector
          outputFields:
              - id
              - text
              - ingestion_namespace
              - source_key
              - source_fingerprint
              - chunk_index
              - chunk_count
          searchParams:
              metric_type: COSINE
              params: {}

search_tools:
    - search_tool_name: searxng-search
      litellm_params:
          search_provider: searxng
          api_base: http://searxng:8080
