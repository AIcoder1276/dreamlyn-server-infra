services:
    # AI inferences.
    ## Multimodal AI service (for text and image understanding).
    ai-multimodal-qwen3.5_9b:
        image: vllm/vllm-openai:latest
        container_name: inference-multimodal-qwen3.5_9b
        restart: unless-stopped
        ipc: host
        gpus: all
        ulimits:
            memlock: -1
        volumes:
            - ./Models/Multimodal/HF_Cache:/root/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
        command: >
            cyankiwi/Qwen3.5-9B-AWQ-4bit
            --served-model-name Qwen3.5-9B
            --max-model-len 8192
            --gpu-memory-utilization 0.9
            --kv-cache-dtype fp8
            --enable-chunked-prefill
            --limit-mm-per-prompt '{"image": 1}'
            --mm-processor-kwargs '{"max_pixels": 314572}'
            --reasoning-parser qwen3
            --generation-config vllm
        networks:
            - dreamlyn_infra_internal_network
    ## Music AI service (for short music generation).
    ai-music-musicgen_small:
        build:
            context: ./Inference/Audio/Music
        container_name: inference-music-musicgen_small
        restart: unless-stopped
        ipc: host
        gpus: all
        volumes:
            - ./Models/Audio/Music/HF_Cache:/app/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - HF_HOME=/app/.cache/huggingface
        command: >
            facebook/musicgen-small
            --served-model-name MusicGen-Small
            --host 0.0.0.0
            --port 8000
            --guidance-scale 3.0
            --max-duration-seconds 30
            --max-new-tokens-at-max-duration 1503
        networks:
            - dreamlyn_infra_internal_network
    ## Voice AI service (for speech synthesis).
    ai-voice-omnivoice:
        build:
            context: ./Inference/Audio/Voice
        container_name: inference-voice-omnivoice
        restart: unless-stopped
        ipc: host
        gpus: all
        volumes:
            - ./Models/Audio/Voice/HF_Cache:/app/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - HF_HOME=/app/.cache/huggingface
        command: >
            k2-fsa/OmniVoice
            --served-model-name OmniVoice
            --host 0.0.0.0
            --port 8000
        networks:
            - dreamlyn_infra_internal_network

    # AI utils.
    searxng:
        image: searxng/searxng:latest
        container_name: tool-search_engine
        restart: unless-stopped
        volumes:
            - ./Tools/SearXNG/settings.yml:/etc/searxng/settings.yml
        networks:
            - dreamlyn_infra_internal_network
        ports:
            - "8080:8080"

networks:
  dreamlyn_infra_internal_network:
    external: true
    name: dreamlyn_mesh
