services:
    # AI inferences.
    ## Text AI service (for talking, common games and so on).
    ai-text-qwen3_4b:
        image: vllm/vllm-openai:latest
        container_name: inference-text-qwen3_4b
        restart: unless-stopped
        ipc: host
        gpus: all
        ulimits:
            memlock: -1
        volumes:
            - ./Models/Text/HF_Cache:/root/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
        command: >
            Qwen/Qwen3-4B-FP8
            --served-model-name Qwen3-4B
            --max-model-len 4096
            --gpu-memory-utilization 0.4
            --enforce-eager
        networks:
            - dreamlyn_infra_internal_network
    ## Vision AI service (for processing images).
    ai-vision-qwen3_vl_2b:
        image: vllm/vllm-openai:latest
        container_name: inference-vision-qwen3_vl_2b
        restart: unless-stopped
        ipc: host
        runtime: nvidia
        gpus: all
        volumes:
            - ./Models/Vision/HF_Cache:/root/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
        command: >
            Qwen/Qwen3-VL-2B-Instruct-FP8
            --served-model-name Qwen3-VL-2B
            --max-model-len 4096
            --enable-chunked-prefill
            --gpu-memory-utilization 0.5
            --limit-mm-per-prompt '{"image": 1}'
            --mm-processor-kwargs '{"max_pixels": 314572}'
        networks:
            - dreamlyn_infra_internal_network
    ## Music AI service (for short music generation).
    ai-music-musicgen_small:
        build:
            context: ./Models/Music
        container_name: inference-music-musicgen_small
        restart: unless-stopped
        ipc: host
        gpus: all
        volumes:
            - ./Models/Music/HF_Cache:/app/.cache/huggingface
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - HF_HOME=/app/.cache/huggingface
        command: >
            facebook/musicgen-small
            --served-model-name MusicGen-Small
            --host 0.0.0.0
            --port 8000
            --guidance-scale 3.0
            --max-duration-seconds 30
            --max-new-tokens-at-max-duration 1503
        networks:
            - dreamlyn_infra_internal_network

    # AI utils.
    searxng:
        image: searxng/searxng:latest
        container_name: tool-search_engine
        restart: unless-stopped
        volumes:
            - ./Tools/SearXNG/settings.yml:/etc/searxng/settings.yml
        networks:
            - dreamlyn_infra_internal_network
        ports:
            - "8080:8080"

networks:
  dreamlyn_infra_internal_network:
    external: true
    name: dreamlyn_mesh
