services:
    # Landing page.
    landing:
        image: nginx:alpine
        container_name: landing_page
        restart: unless-stopped
        volumes:
            - ./landing:/usr/share/nginx/html:ro
        networks:
            - dreamlyn_infra_internal_network

    # Project management system.
    youtrack:
        image: jetbrains/youtrack:2026.2.17012
        container_name: jetbrains_youtrack
        restart: unless-stopped
        volumes:
            - ./youtrack/data:/opt/youtrack/data
            - ./youtrack/conf:/opt/youtrack/conf
            - ./youtrack/logs:/opt/youtrack/logs
            - ./youtrack/temp:/opt/youtrack/temp
            - ./youtrack/backups:/opt/youtrack/backups
        networks:
            - dreamlyn_infra_internal_network
        environment:
            - YOUTRACK_BASE_URL=http://track.dreamlyn.ru


networks:
  dreamlyn_infra_internal_network:
    external: true
    name: dreamlyn_mesh
